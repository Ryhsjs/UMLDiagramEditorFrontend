<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Восстановление пароля — UML Diagram Editor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <div class="card" style="max-width: 400px; margin: 60px auto;">
      <h1>Восстановление пароля</h1>
      <div id="message"></div>
      <form id="forgot-form">
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <button type="submit">Отправить письмо</button>
      </form>
      <p class="muted" style="margin-top: 16px;">
        <a href="index.html">Назад ко входу</a>
      </p>
    </div>
  </main>

  <script type="module">
    import { auth } from './js/api.js';
    import { showMessage, clearMessage } from './js/nav.js';

    const messageEl = document.getElementById('message');

    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessage(messageEl);

      const email = document.getElementById('email').value;

      try {
        await auth.requestPasswordReset(email);
        showMessage(messageEl, 'Если такой email зарегистрирован, письмо со ссылкой отправлено.', 'success');
      } catch (err) {
        showMessage(messageEl, err.message);
      }
    });
  </script>
</body>
</html>
