<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — UML Diagram Editor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <div class="card" style="max-width: 400px; margin: 60px auto;">
      <h1>Вход</h1>
      <div id="message"></div>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <label for="password">Пароль</label>
        <input type="password" id="password" required>
        <button type="submit">Войти</button>
      </form>
      <p class="muted" style="margin-top: 16px;">
        Нет аккаунта? <a href="register.html">Зарегистрироваться</a><br>
        <a href="forgot-password.html">Забыли пароль?</a>
      </p>
    </div>
  </main>

  <script type="module">
    import { auth } from './js/api.js';
    import { showMessage, clearMessage } from './js/nav.js';

    const messageEl = document.getElementById('message');

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessage(messageEl);

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        await auth.login(email, password);
        window.location.href = '/projects.html';
      } catch (err) {
        showMessage(messageEl, err.message);
      }
    });
  </script>
</body>
</html>
