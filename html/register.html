<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — UML Diagram Editor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <div class="card" style="max-width: 400px; margin: 60px auto;">
      <h1>Регистрация</h1>
      <div id="message"></div>
      <form id="register-form">
        <label for="name">Имя</label>
        <input type="text" id="name" required>
        <label for="email">Email</label>
        <input type="email" id="email" required>
        <label for="password">Пароль</label>
        <input type="password" id="password" minlength="6" required>
        <label for="password-confirm">Повторите пароль</label>
        <input type="password" id="password-confirm" minlength="6" required>
        <button type="submit">Зарегистрироваться</button>
      </form>
      <p class="muted" style="margin-top: 16px;">
        Уже есть аккаунт? <a href="index.html">Войти</a>
      </p>
    </div>
  </main>

  <script type="module">
    import { auth } from './js/api.js';
    import { showMessage, clearMessage } from './js/nav.js';

    const messageEl = document.getElementById('message');

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessage(messageEl);

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('password-confirm').value;

      if (password !== passwordConfirm) {
        showMessage(messageEl, 'Пароли не совпадают');
        return;
      }

      try {
        await auth.register({ name, email, password });
        showMessage(
          messageEl,
          'Регистрация прошла успешно. Проверьте почту, чтобы подтвердить аккаунт.',
          'success'
        );
      } catch (err) {
        showMessage(messageEl, err.message);
      }
    });
  </script>
</body>
</html>
